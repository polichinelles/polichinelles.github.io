<script>
"use strict";
const c = document.getElementById('c'), MAINX = c.getContext('2d');
let X = MAINX;
if (!X.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h) };
const M = Math, rnd = (a, b) => a + M.random() * (b - a);

// ---------- palette (from the logo) ----------
const COL = {
  wall: '#e9dcc6', wallLine: '#dccdb4', mauve: '#b89ab8', apron: '#8a1f2a', apronDark: '#6a1520',
  floor: '#1c1838', red: '#d8402c', green: '#2e9a4c', blue: '#3070d0', yellow: '#e6b830',
  mint: '#9ed8c8', sock: '#2a62c8', shoe: '#6b4430', face: '#f1ede6', beard: '#b9b4ad', cane: '#9a9a9a', ink: '#2a2230'
};

// ---------- layout ----------
let W, H, T, S, dpr, LAND = false;
const SCENE = 360, G = 262; // scene band height, ground line inside band
function resize() {
  dpr = M.min(window.devicePixelRatio || 1, 2);
  const iw = innerWidth, ih = innerHeight;
  LAND = iw >= ih;
  if (!LAND) {                    // portrait: fit the width, extra room above and below
    W = 340; S = iw / W; H = M.max(SCENE, ih / S); T = (H - SCENE) * 0.45;
  } else {                        // landscape: fit the height so the floor and buttons are always visible
    S = M.min(ih / 322, iw / 560); W = iw / S; H = ih / S; T = 0;
  }
  c.width = M.round(iw * dpr); c.height = M.round(ih * dpr);
}
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();

// ---------- options (music / sounds / vibrations) ----------
let OPTS = { music: true, sfx: true, vib: true };
try { Object.assign(OPTS, JSON.parse(localStorage.getItem('polichinelles_opts')) || {}) } catch (e) {}
function saveOpts() { try { localStorage.setItem('polichinelles_opts', JSON.stringify(OPTS)) } catch (e) {} }

// ---------- audio ----------
let AC = null;
function beep(f1, f2, dur, type = 'square', vol = .08) {
  if (!AC || !OPTS.sfx) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}

// ---------- music: an original barrel-organ waltz, synthesised live (no audio file) ----------
const NOTE = n => { const m = /^([A-G])(#?)(\d)$/.exec(n); const k = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0); return 440 * 2 ** ((k + 12 * (+m[3] + 1) - 69) / 12) };
// melody: [note, beats] in 3/4, 16 bars
const MEL = [
  ['E4', 1], ['G4', 1], ['C5', 1], ['B4', 2], ['G4', 1], ['A4', 1], ['F4', 1], ['A4', 1], ['G4', 3],
  ['E4', 1], ['G4', 1], ['C5', 1], ['D5', 2], ['C5', 1], ['B4', 1], ['A4', 1], ['B4', 1], ['C5', 3],
  ['E5', 1], ['D5', 1], ['C5', 1], ['A4', 2], ['C5', 1], ['G4', 1], ['E4', 1], ['G4', 1], ['F4', 2], ['A4', 1],
  ['G4', 1], ['C5', 1], ['E5', 1], ['D5', 1], ['B4', 1], ['G4', 1], ['C5', 1], ['G4', 1], ['E4', 1], ['C5', 3]
];
// one chord per bar: [bass, chord tone 1, chord tone 2]
const CHORDS = [['C3', 'E4', 'G4'], ['G2', 'D4', 'F4'], ['F2', 'A3', 'C4'], ['C3', 'E4', 'G4'], ['C3', 'E4', 'G4'], ['G2', 'B3', 'D4'], ['G2', 'D4', 'F4'], ['C3', 'E4', 'G4'],
  ['A2', 'C4', 'E4'], ['F2', 'A3', 'C4'], ['C3', 'E4', 'G4'], ['F2', 'A3', 'C4'], ['C3', 'E4', 'G4'], ['G2', 'B3', 'D4'], ['C3', 'E4', 'G4'], ['C3', 'E4', 'G4']];
const MELB = []; { let b = 0; for (const [n, d] of MEL) { MELB.push({ b, d, f: NOTE(n) }); b += d } }
const LOOP = 48;
let mus = { gain: null, beat: 0, next: 0, timer: null, mi: 0 };
function voice(f, t0, dur, type, vol, filt) {

// ---------- drawing helpers ----------
function poly(k, a) { X.fillStyle = k; X.beginPath(); for (let i = 0; i < a.length; i += 2) X.lineTo(a[i], a[i + 1]); X.closePath(); X.fill() }
function line(k, w, a, cap = 'round') { X.strokeStyle = k; X.lineWidth = w; X.lineCap = cap; X.lineJoin = 'round'; X.beginPath(); for (let i = 0; i < a.length; i += 2) X.lineTo(a[i], a[i + 1]); X.stroke() }

  for (const wh of T0.wh) {
    const ca = M.cos(T0.a), sa = M.sin(T0.a), axw = T0.x + wh.ax * ca - (wh.ay - 10) * sa, ayw = T0.y + wh.ax * sa + (wh.ay - 10) * ca;
    line('#4a4a55', 4, [axw, ayw, wh.x, wh.y]);
    X.save(); X.translate(wh.x, wh.y); X.rotate(wh.ang); const r = wh.r;
    circ('#1d1d24', 0, 0, r); X.fillStyle = '#3a3a44'; for (let k = 0; k < 10; k++) { X.save(); X.rotate(k * .628); X.fillRect(-2, -r - 1.5, 4, 4); X.restore() }
    circ('#f2c230', 0, 0, r * .55); circ('#c99a2e', 0, 0, r * .25); X.fillStyle = '#c99a2e'; for (let k = 0; k < 5; k++) { X.save(); X.rotate(k * 1.257); X.fillRect(-1, 0, 2, r * .5); X.restore() }
    X.restore();
  }
}
function drawGame() {
  if (!TR) return;
  X.save(); X.translate(0, -T); X.scale(ZM, ZM); X.translate(-camX, -camY);
  const x0 = M.floor(camX / 8) * 8 - 16, x1 = camX + VW + 16;
  // decor on the hills (behind the road)
  for (let n = M.floor(x0 / 260); n <= x1 / 260; n++) {
    if (n < 2) continue; const r = hsh(n, 7), x = n * 260 + r * 120, gy = ground(x) + 4;
    if (r < .25) drawHay(x, gy); else if (r < .4) { drawCow(x, gy, hsh(n, 3) < .5 ? 1 : -1); X.fillStyle = '#6b4430'; X.beginPath(); X.moveTo(x - 4, gy); X.lineTo(x + 8, gy); X.lineTo(x + 2, gy - 10); X.fill() } else if (r < .55) { for (let k = 0; k < 3; k++) { const fx = x + k * 9; line('#3a7a3a', 1.5, [fx, gy, fx, gy - 22 - k * 3]); for (let p = 0; p < 8; p++) circ('#f2c230', fx + M.cos(p * .785) * 4.5, gy - 24 - k * 3 + M.sin(p * .785) * 4.5, 2.4); circ('#6b4430', fx, gy - 24 - k * 3, 2.6) } }
    else if (r < .7) { X.strokeStyle = '#a07040'; X.lineWidth = 2; for (let k = 0; k < 4; k++) { const fx = x + k * 14; X.beginPath(); X.moveTo(fx, ground(fx) + 4); X.lineTo(fx, ground(fx) - 14); X.stroke() } X.beginPath(); X.moveTo(x, ground(x) - 10); for (let k = 1; k < 4; k++) X.lineTo(x + k * 14, ground(x + k * 14) - 10); X.stroke() }
  }
  for (let m = M.ceil(x0 / (100 * PXM)) * 100; m * PXM + 120 < x1; m += 100) if (m > 0) drawSign(m * PXM + 120, ground(m * PXM + 120) + 4, m);
  // best distance flag
  const bx = (+(localStorage.getItem('polichinelles_tracteur_m') || 0)) * PXM + 120;
  if (bx > 300 && bx > x0 && bx < x1) { const by = ground(bx); line('#5a3a1c', 2, [bx, by, bx, by - 44]); poly(COL.yellow, [bx, by - 44, bx + 22, by - 38, bx, by - 32]); txt('Record', bx, by - 52, 10, '#3a2010', 'center', false) }
  // the ground
  X.beginPath(); X.moveTo(x0, ground(x0)); for (let x = x0; x <= x1; x += 8) X.lineTo(x, ground(x)); X.lineTo(x1, camY + VH + 50); X.lineTo(x0, camY + VH + 50); X.closePath();
  const gg = X.createLinearGradient(0, camY, 0, camY + VH); gg.addColorStop(0, '#9a6a3c'); gg.addColorStop(1, '#5a3a20'); X.fillStyle = gg; X.fill();
  X.save(); X.clip();
  for (let y = M.floor((camY - 40) / 16) * 16; y < camY + VH + 60; y += 16) { X.fillStyle = 'rgba(40,20,10,.3)'; X.fillRect(x0, y, x1 - x0, 1.5); for (let x = M.floor(x0 / 90) * 90 + ((y / 16) & 1) * 45; x < x1; x += 90) { X.fillRect(x, y, 1.5, 16); circ('rgba(30,15,5,.5)', x + 6, y + 8, 1.2) } }
  for (let x = M.floor(x0 / 220) * 220; x < x1; x += 220) { X.strokeStyle = 'rgba(60,30,10,.35)'; X.lineWidth = 6; X.beginPath(); X.moveTo(x, ground(x) + 20); X.lineTo(x + 110, camY + VH + 60); X.stroke() }
  X.restore();
  X.strokeStyle = '#4e9a3a'; X.lineWidth = 9; X.lineJoin = 'round'; X.beginPath(); for (let x = x0; x <= x1; x += 8) X.lineTo(x, ground(x) + 3); X.stroke();
  X.strokeStyle = '#6ac04a'; X.lineWidth = 3; X.beginPath(); for (let x = x0; x <= x1; x += 8) X.lineTo(x, ground(x)); X.stroke();
  X.fillStyle = '#4e9a3a'; for (let x = M.floor(x0 / 16) * 16; x < x1; x += 16) { X.beginPath(); X.arc(x + 8, ground(x + 8) + 6, 8, 0, M.PI); X.fill() }
  X.fillStyle = COL.yellow; for (let x = M.floor(x0 / 16) * 16; x < x1; x += 16) circ(COL.yellow, x + 8, ground(x + 8) + 15, 1.6);
  for (let x = M.floor(x0 / 37) * 37; x < x1; x += 37) { const gy = ground(x); if (hsh(x, 1) < .5) { line('#6ac04a', 1.5, [x, gy, x - 2, gy - 6]); line('#6ac04a', 1.5, [x + 2, gy, x + 3, gy - 7]) } else if (hsh(x, 2) < .3) { X.fillStyle = '#a89a8a'; X.beginPath(); X.ellipse(x, gy + 10, 5, 3, 0, 0, 6.29); X.fill() } }
  // fuel cans and stars
  for (const cn of cans) if (!cn.got) { const y = ground(cn.x) - 4 + M.sin(t * .1) * 2; X.save(); X.globalAlpha = .3; circ('#fff3a0', cn.x, y - 12, 20); X.restore(); X.fillStyle = '#d8402c'; X.beginPath(); X.roundRect(cn.x - 9, y - 24, 18, 22, 3); X.fill(); X.fillStyle = '#2a2a33'; X.fillRect(cn.x - 2, y - 28, 6, 4); X.fillStyle = '#f2c230'; txt('⛽', cn.x, y - 13, 11, '#fff', 'center', false) }
  for (const co of coins) star(co.x, ground(co.x) - co.h + M.sin(t * .1 + co.x) * 2, 7, t * .05);
  for (const p of smoke) { X.save(); X.globalAlpha = p.l / 50 * .45; circ('#8a8a92', p.x, p.y, p.s); X.restore() }
  drawTractor();
  X.restore();
  // batten with two follow spots
  X.save(); X.translate(0, -T);
  const tx = (TR.x - camX) * ZM, ty2 = (TR.y - camY) * ZM, by = 40;
  X.fillStyle = '#2a2230'; X.fillRect(0, by - 4, W, 5);
  for (const sx of [W * .22, W * .72]) {
    const a = M.atan2(tx - sx, ty2 - by), len = M.hypot(tx - sx, ty2 - by) + 40;
    X.save(); X.translate(sx, by); X.rotate(-a);
    X.save(); X.globalCompositeOperation = 'lighter'; const cg = X.createLinearGradient(0, 0, 0, len); cg.addColorStop(0, `rgba(${AMB.spot},.32)`); cg.addColorStop(1, `rgba(${AMB.spot},.03)`); X.fillStyle = cg; X.beginPath(); X.moveTo(-6, 8); X.lineTo(6, 8); X.lineTo(46, len); X.lineTo(-46, len); X.fill(); X.restore();
    X.fillStyle = '#2b2b33'; X.beginPath(); X.roundRect(-9, -4, 18, 14, 3); X.fill(); X.fillStyle = '#fff3b0'; X.beginPath(); X.ellipse(0, 10, 7, 2.5, 0, 0, 6.29); X.fill();
    X.restore();
  }
  // side curtains
  for (const side of [0, 1]) { X.save(); if (side) { X.translate(W, 0); X.scale(-1, 1) } const cg = X.createLinearGradient(0, 0, 26, 0); cg.addColorStop(0, '#4a0a14'); cg.addColorStop(1, '#9a2032'); X.fillStyle = cg; X.beginPath(); X.moveTo(0, 0); X.lineTo(28, 0); X.quadraticCurveTo(14, H * .4, 22, H); X.lineTo(0, H); X.fill(); X.restore() }
  // front row of the audience
  const ay = H - (LAND ? 12 : 22), ao = -(camX * ZM * .6) % 26;
  for (let x = ao - 26; x < W + 26; x += 26) { const b = M.abs(M.sin(t * .08 + x)) * -2; X.fillStyle = '#120f26'; X.beginPath(); X.arc(x, ay + 12 + b, 13, M.PI, 0); X.fill(); circ('#120f26', x, ay + b, 7) }
  X.fillStyle = '#0b0918'; X.fillRect(0, ay + 12, W, 30);
  X.restore();
}
function drawHud() {
  X.save(); X.translate(0, -T);
  const ty = LAND ? 40 : (T > 60 ? 74 : 64);
  txt(meters() + ' m', W / 2, ty, 26, '#fff');
  if (TR) {
    const fw = 120, fx = W / 2 - fw / 2, fy = ty + 22, low = TR.fuel < 25;
    txt('⛽', fx - 14, fy + 5, 14, '#fff', 'center', false);
    X.fillStyle = 'rgba(20,16,40,.6)'; X.beginPath(); X.roundRect(fx, fy, fw, 10, 5); X.fill();
    X.fillStyle = low ? (M.floor(t / 10) % 2 ? '#ff4f4f' : '#ffb060') : '#7dff8a'; X.beginPath(); X.roundRect(fx, fy, M.max(4, fw * TR.fuel / 100), 10, 5); X.fill();
  }
  // pedals
  const big = LAND ? M.min(40, H * .12) : 46, py = H - 22 - big;
  for (const [x, lab, on, col] of [[22 + big, 'FREIN', brakeOn || keyBrake, '#8a1f2a'], [W - 22 - big, 'GAZ', gasOn || keyGas, '#2e6a46']]) {
    X.save(); X.globalAlpha = on ? .95 : .7; X.fillStyle = on ? (lab === 'GAZ' ? '#3a8f5a' : '#b0283a') : col; X.beginPath(); X.roundRect(x - big, py - big * .8, big * 2, big * 1.6, 14); X.fill();
    X.strokeStyle = COL.yellow; X.lineWidth = 3; X.stroke(); X.fillStyle = 'rgba(0,0,0,.25)'; for (let i = -2; i <= 2; i++) X.fillRect(x - big * .7, py + i * big * .25, big * 1.4, 3);
    txt(lab, x, py, 17, '#fff'); X.restore();
  }
  X.restore();
}

// ---------- loop (fixed 60 Hz step) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += M.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (!paused) { if (resumeT > 0) { resumeT--; t++ } else update() }
    acc -= 1000 / 60;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { last = performance.now() });
</script>
